#Gradle
org.gradle.jvmargs=-Xmx2048M -Dkotlin.daemon.jvm.options\="-Xmx2048M"
# Tests use TestBalloon + the matrix addon (wired in by the asp-conventions plugin).
# Keep the legacy Kotest helper disabled; TestBalloon supplies the Kotest assertion/property integration.
systemProp.KOTEST_NO_ASP_HELPER=true

#Kotlin
kotlin.code.style=official

#Android
android.useAndroidX=true

#MPP
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.stability.nowarn=true
kotlin.native.ignoreDisabledTargets=true


artifactVersion = 3.2.0-SNAPSHOT
jdk.version=17
android.minSdk=30
android.compileSdk=34
